# La pubblicazione programmata.
#
# Il sito e' statico: un articolo con la data nel futuro e' gia' nel repository, e
# diventa una pagina solo quando una build gira dopo quella data. Questo
# workflow e' la build che gira. Non pubblica niente di suo: spinge un commit
# vuoto, Cloudflare vede il push e ricostruisce, e a decidere cosa esce e'
# `lib/publication.ts`.
#
# Perche' un commit vuoto e non una richiesta a un deploy hook.
#
# Il deploy hook era la strada giusta e non esiste piu'. La dashboard di un
# progetto Pages ha le schede Deployments, Metrics, Custom domains e Settings:
# non c'e' piu' nessuna sezione per gli hook, l'API risponde 405 su
# `POST .../deploy-hooks`, e Wrangler non ha il comando. Un commit vuoto spinge
# lo stesso meccanismo che fa ricostruire a ogni push normale, quindi non
# serve nessuna credenziale per farlo funzionare: il `GITHUB_TOKEN` del
# workflow basta e non va configurato da nessuna parte.
#
# Il costo e' una riga in cronologia, e per questo il workflow spinge solo
# quando qualcosa esce davvero. `scripts/is-anything-due-today.mjs` legge i
# registri e risponde: quattro volte a settimana, due sono giorni di coda e due
# sono di riserva, e senza questo controllo la cronologia si riempirebbe di
# duecento commit che non cambiavano niente. Nei giorni in cui non esce nulla
# il workflow esce verde e lo dice, che e' un esito normale e non un guasto.
#
# Quattro volte a settimana, lunedi', mercoledi', giovedi' e venerdi': i due
# giorni della coda (lunedi' e giovedi') piu' due di riserva per il caso in cui
# un push fallisce e un pezzo con la data di oggi resterebbe fuori fino alla
# successiva. Ricostruire quando non c'e' niente da pubblicare non costa niente
# di visibile: il sitemap esce identico, `scripts/ping-indexnow.mjs` non
# annuncia nulla se nessun pezzo porta la data di oggi, e nessuna pagina
# cambia.
#
# Il giorno conta: la data di pubblicazione si confronta con il giorno UTC della
# build (`BUILD_DAY` in `lib/publication.ts`). Un pezzo datato giovedi' esce con
# la build di giovedi' alle 06:00 UTC e, se quel push cade, con quello di
# venerdi'. Per questo il giovedi' e' nel cron: con il solo lun/mer/ven un
# pezzo di giovedi' sarebbe rimasto in attesa fino al venerdi' senza che nessuno
# lo notasse.

name: Publish scheduled pieces

on:
  schedule:
    - cron: "0 6 * * 1,3,4,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check whether a piece is due today
        id: due
        run: |
          set -euo pipefail
          # Lo script stampa `due=true` o `due=false` e poi gli slug. In un output
          # di GitHub Actions ogni riga dopo la prima diventerebbe un valore
          # diverso, quindi la risposta va ridotta alla sua prima riga.
          answer=$(node scripts/is-anything-due-today.mjs)
          echo "$answer"
          echo "due=$(printf '%s\n' "$answer" | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Rebuild by pushing an empty commit
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild so the pieces dated today are exported"
          git push origin HEAD:main
          echo "pushed; Cloudflare rebuilds from this commit"

      - name: Nothing was due today
        if: steps.due.outputs.due != 'true'
        run: |
          echo "no piece carries today's date; not pushing anything."
          echo "the next due piece publishes on the next push or on the next run."