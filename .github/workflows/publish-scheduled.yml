# La pubblicazione programmata.
#
# Il sito è statico: un articolo con la data nel futuro è già nel repository, e
# diventa una pagina solo quando una build gira dopo quella data. Questo
# workflow è la build che gira. Non pubblica niente di suo: chiede a Cloudflare
# di ricostruire, e a decidere cosa esce è `lib/publication.ts`.
#
# Quattro volte a settimana, lunedì, mercoledì, giovedì e venerdì: sono i giorni
# in cui la coda editoriale può uscire (lunedì e giovedì), più due di riserva
# per il caso in cui una build fallisce e un pezzo con la data di oggi resterebbe
# fuori fino alla successiva. Ricostruire quando non c'è niente da pubblicare non
# costa niente di visibile: il sitemap esce identico,
# `scripts/ping-indexnow.mjs` non annuncia nulla se nessun pezzo porta la data di
# oggi, e nessuna pagina cambia. È per questo che il ping è condizionato alla
# data invece di partire a ogni build.
#
# Il giorno conta: la data di pubblicazione si confronta con il giorno UTC della
# build (`BUILD_DAY` in `lib/publication.ts`). Un pezzo datato giovedì esce con la
# build di giovedì alle 06:00 UTC e, se quella build cade, con quella di venerdì.
# Per questo il giovedì è nel cron: con il solo lun/mer/ven un pezzo di giovedì
# sarebbe rimasto in attesa fino al venerdì senza che nessuno lo notasse.
#
# Il segreto da configurare: `CLOUDFLARE_DEPLOY_HOOK` nelle impostazioni del
# repository (Settings → Secrets and variables → Actions), lo stesso valore che
# il pannello amministrativo ha come variabile sul progetto Pages. È un URL di
# deploy hook, non una chiave API: può solo avviare una build.
#
# Senza il segreto il workflow esce verde e lo dice nel log. Un fallimento qui
# non deve sembrare un guasto del sito quando l'unica cosa che manca è una
# configurazione che nessuno ha ancora fatto.

name: Publish scheduled pieces

on:
  schedule:
    - cron: "0 6 * * 1,3,4,5"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          PROJECT_NAME: mattiaciuni
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not configured; nothing to trigger."
            echo "Pieces whose date has arrived will publish on the next push instead."
            exit 0
          fi
          # La chiave IndexNow e una stringa esadecimale, non un indirizzo: e'
          # cosi' che questo segreto e' gia' stato sbagliato una volta, e senza
          # questo controllo la curl risponderebbe con un codice che sembra un
          # guasto di Cloudflare invece che un valore sbagliato, il giorno in cui
          # un pezzo doveva uscire e nessuno saprebbe perche' non e' uscito.
          # Solo la forma "non e' un indirizzo" blocca: se un giorno Cloudflare
          # cambiasse la forma dell'URL, un avviso dice che il valore non e' quello
          # aspettato, ma un hook valido continua a funzionare.
          case "$DEPLOY_HOOK" in
            https://*) ;;
            *)
              echo "::error::CLOUDFLARE_DEPLOY_HOOK is not a URL."
              echo "It is the deploy hook URL from Cloudflare > $PROJECT_NAME > Settings > Builds > Add deploy hook, not a key."
              exit 1
              ;;
          esac
          case "$DEPLOY_HOOK" in
            *deploy-hooks/*) ;;
            *)
              echo "::warning::CLOUDFLARE_DEPLOY_HOOK does not look like a Cloudflare deploy hook URL."
              echo "Trying it anyway, but check the value if the build does not start."
              ;;
          esac
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "deploy hook answered $status"
          if [ "$status" -ge 300 ]; then
            echo "::error::The deploy hook refused the build (HTTP $status)."
            exit 1
          fi
